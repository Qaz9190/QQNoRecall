name: Build QQNoRecall

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # theos-action 仅安装 Theos + iOS SDK 并导出 $THEOS，不会自动编译
      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build .deb (rootless, Dopamine/palera1n)
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log

      # 失败也能拿到日志（fine-grained PAT 无法读取 gh run view --log）
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qqnorecall-deb
          path: packages/*.deb
          if-no-files-found: error
